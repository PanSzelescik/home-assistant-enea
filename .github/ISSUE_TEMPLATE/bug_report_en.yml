name: Bug Report (EN)
description: Report a problem with the Enea Licznik integration
labels: ["bug", "lang: en"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please ask installation and setup questions in [Discussions](https://github.com/PanSzelescik/home-assistant-enea/discussions).

  - type: checkboxes
    id: existing
    attributes:
      label: Existing Issues
      options:
        - label: There is no similar problem in the issue list yet
          required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      description: Settings → About
      placeholder: "e.g. 2026.10.0"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Enea Licznik Version
      description: HACS → Enea Licznik
      placeholder: "e.g. 1.7.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Problem Area
      options:
        - Login and setup
        - Sensors
        - Energy Dashboard statistics
        - Energy costs (Enea Ceny)
        - Bill estimate
        - Repairs (issues raised in Home Assistant)
        - Other
    validations:
      required: true

  - type: input
    id: tariff
    attributes:
      label: Tariff Group
      placeholder: "e.g. G11, G12, G13"

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What is happening, and what was the expected behaviour?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Home Assistant Logs
      description: |
        Debug logs help the most: Settings → Devices & Services → Enea → menu ⋮ → Enable debug logging, reproduce the problem, then disable debug logging — the log file downloads automatically. Paste the parts from the `enea` domain.
      render: text

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics Report
      description: |
        Optionally attach the diagnostics report (Settings → Devices & Services → Enea → menu ⋮ → Download diagnostics). Login details, the address, the PPE number, Portal Odbiorcy Enea identifiers and meter and agreement numbers are hidden in it automatically.
      render: json
