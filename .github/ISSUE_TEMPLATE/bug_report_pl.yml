name: Zgłoszenie błędu (PL)
description: Zgłoś problem z integracją Enea Licznik
labels: ["bug", "lang: pl"]
body:
  - type: markdown
    attributes:
      value: |
        Dziękujemy za zgłoszenie! Pytania o instalację i konfigurację zadawaj w [Dyskusjach](https://github.com/PanSzelescik/home-assistant-enea/discussions).

  - type: checkboxes
    id: existing
    attributes:
      label: Istniejące zgłoszenia
      options:
        - label: Na liście zgłoszeń nie ma jeszcze podobnego problemu
          required: true

  - type: input
    id: ha_version
    attributes:
      label: Wersja Home Assistant
      description: Ustawienia → Informacje
      placeholder: "np. 2026.10.0"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Wersja integracji Enea Licznik
      description: HACS → Enea Licznik
      placeholder: "np. 1.7.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Obszar problemu
      options:
        - Logowanie i konfiguracja
        - Sensory
        - Statystyki w Energy Dashboard
        - Koszty energii (Enea Ceny)
        - Szacowany rachunek
        - Naprawy (zgłoszenia w Home Assistant)
        - Inne
    validations:
      required: true

  - type: input
    id: tariff
    attributes:
      label: Grupa taryfowa
      placeholder: "np. G11, G12, G13"

  - type: textarea
    id: description
    attributes:
      label: Opis problemu
      description: Co się dzieje i jakie zachowanie było oczekiwane?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logi Home Assistant
      description: |
        Najwięcej pomagają logi debugowania: Ustawienia → Urządzenia i usługi → Enea → menu ⋮ → Włącz rejestrowanie debugowania, odtwórz problem, a następnie wyłącz rejestrowanie — plik z logami pobierze się automatycznie. Wklej fragmenty dotyczące domeny `enea`.
      render: text

  - type: textarea
    id: diagnostics
    attributes:
      label: Raport diagnostyczny
      description: |
        Opcjonalnie załącz raport diagnostyczny (Ustawienia → Urządzenia i usługi → Enea → menu ⋮ → Pobierz diagnostykę). Dane logowania, adres, numer PPE, identyfikatory z Portalu Odbiorcy Enea oraz numery liczników i umów są w nim automatycznie ukrywane.
      render: json
