[project]
name = "home-assistant-enea"
version = "1.6.0"
requires-python = ">=3.14.2,<3.15"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "homeassistant>=2026.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components.enea"]

[tool.coverage.report]
precision = 1
show_missing = true
