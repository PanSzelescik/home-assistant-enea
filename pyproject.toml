[project]
name = "home-assistant-enea"
version = "1.8.5"
requires-python = ">=3.14.2,<3.15"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "holidays>=0.104",
    "homeassistant>=2026.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = [".", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "BLE",     # flake8-blind-except
    "LOG",     # flake8-logging
    "RUF",     # ruff-specific
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Polish text and the en dash in names are intended
]

[tool.ruff.lint.per-file-ignores]
# Fixtures imported from ha_instance are redefined as test parameters.
"tests/**" = ["F811"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components.enea"]

[tool.coverage.report]
precision = 1
show_missing = true
